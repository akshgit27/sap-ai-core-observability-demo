apiVersion: ai.sap.com/v1alpha1
kind: ServingTemplate

metadata:
  name: observability-demo
  annotations:
    scenarios.ai.sap.com/name: "observability-demo"
    scenarios.ai.sap.com/description: "Simple observability test service"
    executables.ai.sap.com/name: "observability-demo-exec"
    executables.ai.sap.com/description: "Simple HTTP service for observability testing"

  labels:
    scenarios.ai.sap.com/id: "observability-demo"
    ai.sap.com/version: "1.0.0"

spec:
  inputs:
    parameters:
      - name: image
        type: string
        default: "mendhak/http-https-echo:31"
        description: "Public HTTP echo image"

  template:
    apiVersion: "serving.kserve.io/v1beta1"

    metadata:
      labels: |
        ai.sap.com/resourcePlan: starter

    spec: |
      predictor:
        minReplicas: 1
        maxReplicas: 1
        containers:
          - name: kserve-container
            image: "{{inputs.parameters.image}}"
            ports:
              - containerPort: 8080
                protocol: TCP
            env:
              - name: PROMETHEUS_ENABLED
                value: "true"
              - name: LOG_IGNORE_PATH
                value: "/ping"
