apiVersion: ai.sap.com/v1alpha1
kind: ServingTemplate

metadata:
  name: observability-demo
  annotations:
    scenarios.ai.sap.com/description: "Simple SAP AI Core observability demo"
    scenarios.ai.sap.com/name: "observability-demo"
    executables.ai.sap.com/description: "HTTP inference service with request logging"
    executables.ai.sap.com/name: "observability-demo"
  labels:
    scenarios.ai.sap.com/id: "observability-demo"
    ai.sap.com/version: "0.0.2"

spec:
  inputs:
    parameters:
      - name: image
        default: "python:3.12-slim"
        type: string
        description: "Public Python image"

  template:
    apiVersion: "serving.kserve.io/v1beta1"

    metadata:
      annotations: |
        autoscaling.knative.dev/metric: rps
        autoscaling.knative.dev/target: 10
        autoscaling.knative.dev/targetBurstCapacity: 10
      labels: |
        ai.sap.com/resourcePlan: "starter"

    spec: |
      predictor:
        minReplicas: 1
        maxReplicas: 1
        containers:
          - name: kserve-container
            image: "{{inputs.parameters.image}}"
            ports:
              - containerPort: 8080
                protocol: TCP
            command:
              - /bin/sh
            args:
              - -c
              - |
                cat > /tmp/server.py <<'PY'
                from http.server import BaseHTTPRequestHandler, HTTPServer
                import json
                import time
                import sys

                class Handler(BaseHTTPRequestHandler):
                    def do_POST(self):
                        start = time.time()
                        length = int(self.headers.get("Content-Length", "0"))
                        body = self.rfile.read(length)

                        request_id = self.headers.get("X-Request-ID", "demo-request")

                        print(
                            f"request_id={request_id} "
                            f"path={self.path} "
                            f"received_bytes={len(body)}",
                            flush=True
                        )

                        response = {
                            "status": "ok",
                            "request_id": request_id,
                            "path": self.path,
                            "message": "SAP AI Core observability demo"
                        }

                        payload = json.dumps(response).encode()

                        self.send_response(200)
                        self.send_header("Content-Type", "application/json")
                        self.send_header("Content-Length", str(len(payload)))
                        self.end_headers()
                        self.wfile.write(payload)

                        latency_ms = round((time.time() - start) * 1000, 2)

                        print(
                            f"request_id={request_id} "
                            f"latency_ms={latency_ms}",
                            flush=True
                        )

                    def log_message(self, format, *args):
                        return

                print("Observability demo server starting on port 8080", flush=True)

                HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
                PY

                python /tmp/server.py
